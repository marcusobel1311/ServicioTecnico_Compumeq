name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 */4 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://mpqsaacbusjieeudktev.supabase.co/rest/v1/"
